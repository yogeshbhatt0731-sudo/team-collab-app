spring.application.name=workspace-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://localhost:3306/workspace_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8082

# AI service (Python FastAPI) for smart task search
ai.service.url=${AI_SERVICE_URL:http://localhost:8083}

#Rabbitmq properties set
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:teamcollab}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:sunbeam}

# RSA public key matching auth-service's jwt.private-key, used to verify incoming JWTs
jwt.public-key=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----